<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Unity gameplay samples</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #141c22; color: #e7e6dc; }
    body { display: flex; flex-direction: column; font: 1rem/1.5 system-ui, sans-serif;
           padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                    env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
    .sample-nav { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; padding: .55rem 1rem;
                  background: #1c2a30; border-bottom: 1px solid #54716c; }
    .sample-nav a { color: #bfe8dc; text-underline-offset: .2em; }
    .sample-nav a:focus-visible { outline: 2px solid #bfe8dc; outline-offset: 3px; }
    main { position: relative; flex: 1; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; gap: .75rem;
              padding: 2rem; font: 1rem/1.5 system-ui, sans-serif; text-align: center; pointer-events: none; }
    #status[hidden], #retry[hidden] { display: none; }
    progress { width: min(15rem, 75vw); margin: auto; accent-color: #78bfaa; }
    #retry { justify-self: center; padding: .5rem 1rem; pointer-events: auto; cursor: pointer;
             font: inherit; color: #bfe8dc; border: 1px solid #78bfaa; border-radius: .25rem; background: #1c2a30; }
    #retry:focus-visible { outline: 2px solid #bfe8dc; outline-offset: 3px; }
  </style>
</head>
<body>
  <nav class="sample-nav" aria-label="Sample navigation">
    <a href="../">Sample gallery</a>
    <a id="sample-code-link" href="https://github.com/Sciuzza84/sciuzza84.github.io/tree/main/samples">Code and checks</a>
    <a href="https://sciuzza84.github.io/#experience">Portfolio</a>
  </nav>
  <main>
    <canvas id="player" tabindex="0" aria-label="Interactive Unity sample"></canvas>
    <div id="status">
      <span role="status">Loading Unity sample…</span>
      <progress aria-label="Unity player loading progress" max="1" value="0"></progress>
      <button id="retry" type="button" hidden>Reload sample</button>
    </div>
  </main>
  <script src="Build/6ad8d6d98113845a9eb6a96f00bf19e3.loader.js"></script>
  <script>
    const canvas = document.getElementById('player');
    const status = document.getElementById('status');
    const progress = status.querySelector('progress');
    const retry = document.getElementById('retry');
    let failed = false;
    retry.addEventListener('click', () => window.location.reload());

    function showError(error) {
      console.error('Unity sample startup failed:', error);
      if (failed || status.hidden) return;
      failed = true;
      const reason = /not support WebGL|WebGL is not supported/i.test(String(error))
        ? 'WebGL is unavailable in this browser.'
        : 'A required player file could not be loaded.';
      status.querySelector('span').textContent = 'The Unity sample could not start. ' + reason;
      progress.hidden = true;
      retry.hidden = false;
    }

    const config = {
      dataUrl: "Build/fb5be436c93a9deb9cc3a6c39dd9afb0.data.unityweb",
      frameworkUrl: "Build/553bdce51e0ab938a7a8a409a15f5a07.framework.js.unityweb",
      codeUrl: "Build/f07d6a0fb0aa4de7e5675ee06e763daa.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      // IMGUI uses bitmap pixels for control sizes. Keep one bitmap pixel per CSS pixel.
      devicePixelRatio: 1,
      companyName: "Cristiano Piromalli",
      productName: "Unity gameplay samples",
      productVersion: "0.1.0",
      showBanner: (message, type) => {
        if (type === 'error') showError(message);
        else if (type === 'warning') console.warn(message);
      }
    };
    if (typeof createUnityInstance === 'function') {
      createUnityInstance(canvas, config, value => { progress.value = value; })
        .then(() => { if (!failed) status.hidden = true; })
        .catch(showError);
    } else {
      showError('The Unity loader did not run.');
    }
  </script>
  <script>
    (() => {
      const canvas = document.getElementById('player');
      if (navigator.maxTouchPoints < 1) return;

      function cancelledTouch(id) {
        const touch = new Touch({ identifier: id, target: canvas, clientX: -1, clientY: -1 });
        return new TouchEvent('touchcancel', { changedTouches: [touch], bubbles: true });
      }

      // Keep native canvas input on browsers that cannot synthesize a touch cancellation.
      try { cancelledTouch(0); } catch { return; }

      const minimumTravel = 12;
      const scrollbarEdge = 36;
      let gesture;

      canvas.addEventListener('touchstart', event => {
        gesture = undefined;
        if (event.touches.length !== 1) return;
        const touch = event.touches[0];
        if (touch.clientX >= canvas.getBoundingClientRect().right - scrollbarEdge) return;
        gesture = { id: touch.identifier, x: touch.clientX, y: touch.clientY, wheelY: touch.clientY, axis: '' };
      }, { passive: true });

      canvas.addEventListener('touchmove', event => {
        if (!gesture || event.touches.length !== 1) return;
        const touch = event.touches[0];
        if (touch.identifier !== gesture.id) return;
        if (!gesture.axis) {
          const xDistance = Math.abs(touch.clientX - gesture.x);
          const yDistance = Math.abs(touch.clientY - gesture.y);
          if (Math.max(xDistance, yDistance) < minimumTravel) return;
          gesture.axis = yDistance > xDistance * 1.25 ? 'vertical' : 'horizontal';
        }
        if (gesture.axis !== 'vertical') return;

        const deltaY = gesture.wheelY - touch.clientY;
        if (Math.abs(deltaY) < 5) return;
        gesture.wheelY = touch.clientY;
        canvas.dispatchEvent(new WheelEvent('wheel', {
          clientX: touch.clientX, clientY: touch.clientY, deltaY, bubbles: true, cancelable: true,
        }));
      }, { passive: true });

      canvas.addEventListener('touchend', event => {
        const finished = gesture;
        gesture = undefined;
        if (!finished || finished.axis !== 'vertical') return;

        // Release Unity's pressed control outside the canvas so a short swipe cannot click it.
        event.preventDefault();
        event.stopImmediatePropagation();
        canvas.dispatchEvent(cancelledTouch(finished.id));
      }, { capture: true, passive: false });
      canvas.addEventListener('touchcancel', () => { gesture = undefined; }, { passive: true });
    })();
  </script>
</body>
</html>
